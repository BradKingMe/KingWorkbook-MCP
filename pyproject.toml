[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kingworkbook-mcp"
version = "0.1.0"
description = "Local, read-only Excel and CSV inspection and reconciliation tools over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Brad King" }]
dependencies = [
  "mcp[cli]>=2.1,<3",
  "openpyxl>=3.1.5,<4",
  "defusedxml>=0.7.1,<0.8",
]

[project.scripts]
kingworkbook-mcp = "kingworkbook_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
